# Byte budget and Lighthouse: report only, on pushes to main only. A separate workflow so that its
# 45 minutes never delay or block a deployment. No secrets.
name: report

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: report
  cancel-in-progress: true

env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund --fetch-retries=6
      - run: npm run build
      - name: Fonts used by the browser checks
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-core=20201225-2
      - name: Byte budget (report only)
        continue-on-error: true
        run: npm run budget
      - name: Lighthouse (report only)
        continue-on-error: true
        run: npm run lh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: measurements
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 14
